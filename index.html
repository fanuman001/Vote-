<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>離線標記列印工具</title>
    <style>
        /* 控制顯示與列印的基礎設定 */
        body { font-family: "Microsoft JhengHei", Arial, sans-serif; margin: 0; padding: 20px; background: #f0f0f0; }
        .controls { background: white; padding: 15px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .controls input, .controls select { margin-right: 10px; margin-bottom: 10px; }

        /* 列印頁面設定 */
        .page {
            background: white;
            position: relative;
            margin: 0 auto 20px auto;
            border: 1px solid #ccc;
            box-sizing: border-box;
            overflow: hidden;
            page-break-after: always;
        }

        /* A4 與 A3 尺寸定義 (96 DPI 換算) */
        .A4 { width: 210mm; height: 297mm; }
        .A3 { width: 297mm; height: 420mm; }

        /* 導角圖示與文字容器 */
        .content-item {
            position: absolute;
            display: flex;
            align-items: center;
        }
        
        /* 導角圖示樣式 */
        .corner-icon {
            width: 20px;
            height: 20px;
            border: 2px solid #000;
            border-top-left-radius: 8px; /* 模擬導角 */
            margin-right: 5px;
        }

        @media print {
            .controls { display: none; } /* 列印時隱藏控制欄 */
            body { background: white; padding: 0; }
            .page { margin: 0; border: none; }
        }
    </style>
</head>
<body>

<div class="controls">
    <h3>列印設定</h3>
    紙張規格：
    <select id="paperSize">
        <option value="A4">A4 (210x297mm)</option>
        <option value="A3">A3 (297x420mm)</option>
    </select>
    內容：<input type="text" id="inputText" placeholder="請輸入文字" value="測試文字">
    <br>
    座標 X (mm)：<input type="number" id="posX" value="50">
    座標 Y (mm)：<input type="number" id="posY" value="50">
    <br>
    列印總張數：<input type="number" id="totalPage" value="5">
    每隔幾張列印：<input type="number" id="interval" value="1" min="1"> (1 代表每張都印)
    <br>
    <button onclick="generatePages()">生成預覽</button>
    <button onclick="window.print()">執行列印</button>
</div>

<div id="printArea"></div>

<script>
    function generatePages() {
        const paperSize = document.getElementById('paperSize').value;
        const text = document.getElementById('inputText').value;
        const x = document.getElementById('posX').value;
        const y = document.getElementById('posY').value;
        const total = parseInt(document.getElementById('totalPage').value);
        const interval = parseInt(document.getElementById('interval').value);
        
        const area = document.getElementById('printArea');
        area.innerHTML = ''; // 清除舊內容

        for (let i = 1; i <= total; i++) {
            const page = document.createElement('div');
            page.className = 'page ' + paperSize;

            // 判斷是否為間隔張數需要寫入內容
            if ((i - 1) % interval === 0) {
                const item = document.createElement('div');
                item.className = 'content-item';
                item.style.left = x + 'mm';
                item.style.top = y + 'mm';
                
                // 插入導角圖示與文字
                item.innerHTML = '<div class="corner-icon"></div><span>' + text + ' (第' + i + '張)</span>';
                page.appendChild(item);
            }

            area.appendChild(page);
        }
    }
</script>

</body>
</html>
