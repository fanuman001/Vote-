<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>工業標記定位工具 v3.0</title>
    <style>
        body { font-family: "Microsoft JhengHei", sans-serif; margin: 0; padding: 15px; background: #e0e0e0; font-size: 14px; }
        .controls { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); max-width: 900px; margin: 0 auto 20px auto; }
        .section { border-bottom: 1px dashed #ccc; padding: 10px 0; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        
        /* 導角選擇器樣式 */
        .corner-picker { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
        .picker-btn { border: 2px solid #ddd; padding: 5px; cursor: pointer; background: #fff; border-radius: 4px; text-align: center; }
        .picker-btn.active { border-color: #007bff; background: #eef; }
        .picker-btn .icon-box { width: 30px; height: 30px; margin: 0 auto; font-size: 12px; }

        /* 常用勾選區 */
        .preset-area { display: flex; flex-wrap: wrap; gap: 10px; background: #f8f9fa; padding: 10px; border-radius: 5px; }
        .preset-chip { cursor: pointer; padding: 5px 12px; background: #007bff; color: white; border-radius: 15px; font-size: 13px; }

        /* 清單預覽 */
        .queue-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        .queue-table th, .queue-table td { border: 1px solid #ddd; padding: 6px; text-align: center; }

        /* 列印頁面設定 */
        .page { background: white; position: relative; margin: 20px auto; border: 1px solid #999; box-sizing: border-box; page-break-after: always; overflow: hidden; }
        .A4 { width: 210mm; height: 297mm; }
        /* A3 橫式轉向 */
        .A3 { width: 420mm; height: 297mm; }

        /* 標記樣式 */
        .print-item { position: absolute; display: flex; align-items: center; white-space: nowrap; }
        .icon-box { 
            position: relative; border: 2px solid #000; background: #fff;
            display: inline-flex; align-items: center; justify-content: center;
            font-weight: bold; overflow: hidden; margin-right: 8px;
        }
        .mask { position: absolute; width: 75%; height: 75%; background: white; border: 2px solid #000; box-sizing: border-box; transform: rotate(45deg); }
        .m-tl { top: -52%; left: -52%; } .m-tr { top: -52%; right: -52%; }
        .m-bl { bottom: -52%; left: -52%; } .m-br { bottom: -52%; right: -52%; }

        @media print {
            .controls { display: none; }
            body { background: white; padding: 0; }
            .page { margin: 0; border: none; }
        }
    </style>
</head>
<body>

<div class="controls">
    <div class="section grid">
        <div>
            <h4>1. 紙張與批次</h4>
            規格：<select id="paperSize" onchange="generate()"><option value="A4">A4 (直)</option><option value="A3">A3 (橫)</option></select>
            總張數：<input type="number" id="totalPage" value="1" style="width:60px" oninput="generate()">
            間隔：<input type="number" id="interval" value="1" style="width:50px" oninput="generate()"> (1為每張印)
        </div>
        <div>
            <h4>2. 常用欄位快選 (點擊新增)</h4>
            <div class="preset-area">
                <span class="preset-chip" onclick="quickAdd('16mil 1/E', '1', 3)">16mil 1/E (導左下)</span>
                <span class="preset-chip" onclick="quickAdd('4mil E/H', 'E', 3)">4mil E/H (導左下)</span>
                <span class="preset-chip" onclick="quickAdd('16mil 1/E', '1', 5)">16mil 1/E (右上不導)</span>
                <span class="preset-chip" onclick="quickAdd('4mil E/H', 'E', 5)">4mil E/H (右上不導)</span>
            </div>
        </div>
    </div>

    <div class="section">
        <h4>3. 自訂新增品項</h4>
        文字：<input type="text" id="inTxt" value="自訂內容">
        內部：<input type="text" id="inNum" value="1" style="width:40px">
        X (mm)：<input type="number" id="inX" value="20" style="width:50px">
        Y (mm)：<input type="number" id="inY" value="20" style="width:50px">
        大小：<input type="number" id="inSize" value="30" style="width:50px"> px
        
        <div class="corner-picker" id="cornerPicker">
            </div>
        <button onclick="addCurrentItem()" style="background:#007bff; color:white; border:none; padding:8px 15px; cursor:pointer; border-radius:4px;">新增此項至清單</button>
    </div>

    <div class="section">
        <h4>待列印清單</h4>
        <table class="queue-table">
            <thead><tr><th>文字</th><th>位置(X,Y)</th><th>導角類型</th><th>操作</th></tr></thead>
            <tbody id="queueBody"></tbody>
        </table>
        <p style="color:red; font-size:12px;">※ 您可以新增多個品項，它們會同時顯示在同一張紙的指定位置。</p>
        <button onclick="window.print()" style="padding:10px 25px; background:#28a745; color:white; border:none; border-radius:5px; cursor:pointer; font-weight:bold;">執行列印</button>
        <button onclick="clearQueue()" style="margin-left:10px; background:#666; color:#fff; border:none; padding:5px 10px; cursor:pointer; border-radius:5px;">清空清單</button>
    </div>
</div>

<div id="printArea"></div>

<script>
    var queue = [];
    var selectedCornerType = 3; // 預設 3:導左下

    // 導角定義 (左上, 右上, 左下, 右下)
    var cornerDefs = {
        1: [0,0,1,1], 2: [1,1,1,1], 3: [0,0,1,0], 4: [0,0,0,1],
        5: [1,0,1,1], 6: [0,1,1,1], 7: [1,0,0,1]
    };

    function initPicker() {
        var picker = document.getElementById('cornerPicker');
        for (var i = 1; i <= 7; i++) {
            var btn = document.createElement('div');
            btn.className = 'picker-btn' + (i === selectedCornerType ? ' active' : '');
            btn.id = 'p-' + i;
            btn.onclick = (function(idx){ return function(){ selectCorner(idx); }; })(i);
            
            var iconHtml = createIconHtml(24, '?', cornerDefs[i]);
            btn.innerHTML = iconHtml + '<div style="font-size:10px">' + i + '號</div>';
            picker.appendChild(btn);
        }
    }

    function selectCorner(idx) {
        selectedCornerType = idx;
        for (var i = 1; i <= 7; i++) document.getElementById('p-'+i).className = 'picker-btn';
        document.getElementById('p-'+idx).className = 'picker-btn active';
    }

    function createIconHtml(size, num, corners) {
        var html = '<div class="icon-box" style="width:'+size+'px;height:'+size+'px;font-size:'+(size*0.6)+'px;">' + num;
        if(corners[0]) html += '<div class="mask m-tl"></div>';
        if(corners[1]) html += '<div class="mask m-tr"></div>';
        if(corners[2]) html += '<div class="mask m-bl"></div>';
        if(corners[3]) html += '<div class="mask m-br"></div>';
        html += '</div>';
        return html;
    }

    function addCurrentItem() {
        queue.push({
            txt: document.getElementById('inTxt').value,
            num: document.getElementById('inNum').value,
            x: document.getElementById('inX').value,
            y: document.getElementById('inY').value,
            size: document.getElementById('inSize').value,
            corner: selectedCornerType
        });
        updateQueueUI();
    }

    function quickAdd(txt, num, cornerIdx) {
        queue.push({ txt: txt, num: num, x: 20, y: 20, size: 30, corner: cornerIdx });
        updateQueueUI();
    }

    function updateQueueUI() {
        var body = document.getElementById('queueBody');
        body.innerHTML = '';
        queue.forEach(function(item, idx){
            var tr = document.createElement('tr');
            tr.innerHTML = '<td>'+item.txt+'('+item.num+')</td>' +
                           '<td>'+item.x+', '+item.y+'</td>' +
                           '<td>'+item.corner+'號</td>' +
                           '<td><button onclick="removeItem('+idx+')">刪除</button></td>';
            body.appendChild(tr);
        });
        generate();
    }

    function removeItem(idx) { queue.splice(idx, 1); updateQueueUI(); }
    function clearQueue() { queue = []; updateQueueUI(); }

    function generate() {
        var area = document.getElementById('printArea');
        area.innerHTML = '';
        var pSize = document.getElementById('paperSize').value;
        var total = parseInt(document.getElementById('totalPage').value);
        var interval = parseInt(document.getElementById('interval').value);

        for (var i = 1; i <= total; i++) {
            var page = document.createElement('div');
            page.className = 'page ' + pSize;

            if ((i - 1) % interval === 0) {
                queue.forEach(function(item) {
                    var el = document.createElement('div');
                    el.className = 'print-item';
                    el.style.left = item.x + 'mm';
                    el.style.top = item.y + 'mm';
                    
                    var icon = createIconHtml(item.size, item.num, cornerDefs[item.corner]);
                    el.innerHTML = icon + '<span style="font-size:'+(item.size*0.5)+'px; font-weight:bold;">'+item.txt+'</span>';
                    page.appendChild(el);
                });
            }
            area.appendChild(page);
        }
    }

    initPicker();
    generate();
</script>

</body>
</html>
