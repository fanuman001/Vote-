<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>精確定位標記工具</title>
    <style>
        body { font-family: "Microsoft JhengHei", sans-serif; margin: 0; padding: 15px; background: #e0e0e0; }
        .controls { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); max-width: 800px; margin: 0 auto 20px auto; }
        .section { border-bottom: 1px dashed #ccc; padding: 10px 0; }
        h4 { margin: 5px 0; color: #333; }
        
        .preset-list { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 10px 0; }
        .preset-item { border: 1px solid #ddd; padding: 10px; background: #f9f9f9; border-radius: 5px; cursor: pointer; }
        .preset-item:hover { background: #eef; }

        /* 列印頁面 */
        .page { background: white; position: relative; margin: 20px auto; border: 1px solid #999; box-sizing: border-box; page-break-after: always; overflow: hidden; }
        .A4 { width: 210mm; height: 297mm; }
        .A3 { width: 297mm; height: 420mm; }

        /* 定位容器 */
        .print-item { position: absolute; display: flex; align-items: center; white-space: nowrap; }
        
        /* 導角圖示 */
        .icon-box { 
            position: relative; border: 2px solid #000; background: #fff;
            display: inline-flex; align-items: center; justify-content: center;
            font-weight: bold; overflow: hidden; margin-right: 10px;
        }
        .mask { position: absolute; width: 75%; height: 75%; background: white; border: 2px solid #000; box-sizing: border-box; transform: rotate(45deg); }
        .m-tl { top: -52%; left: -52%; } .m-tr { top: -52%; right: -52%; }
        .m-bl { bottom: -52%; left: -52%; } .m-br { bottom: -52%; right: -52%; }

        @media print {
            .controls { display: none; }
            body { background: white; padding: 0; }
            .page { margin: 0; border: none; }
        }
    </style>
</head>
<body>

<div class="controls">
    <div class="section">
        <h4>1. 設定座標與紙張</h4>
        規格：<select id="paperSize" onchange="generate()"><option value="A4">A4</option><option value="A3">A3</option></select>
        座標 X (mm)：<input type="number" id="posX" value="50" oninput="generate()">
        座標 Y (mm)：<input type="number" id="posY" value="50" oninput="generate()">
        <br>
        總張數：<input type="number" id="totalPage" value="5" oninput="generate()">
        間隔張數：<input type="number" id="interval" value="1" oninput="generate()"> (1代表每張都印)
    </div>

    <div class="section">
        <h4>2. 點選常用欄位 (直接套用)</h4>
        <div class="preset-list">
            <div class="preset-item" onclick="apply('16mil 1/E', '1', [0,0,1,0])">
                <b>16mil 1/E</b><br>導左下一角 / 內1
            </div>
            <div class="preset-item" onclick="apply('4mil E/H', 'E', [0,0,1,0])">
                <b>4mil E/H</b><br>導左下一角 / 內E
            </div>
            <div class="preset-item" onclick="apply('16mil 1/E', '1', [1,0,1,1])">
                <b>16mil 1/E</b><br>右上不導其餘導 / 內1
            </div>
            <div class="preset-item" onclick="apply('4mil E/H', 'E', [1,0,1,1])">
                <b>4mil E/H</b><br>右上不導其餘導 / 內E
            </div>
        </div>
    </div>

    <div class="section">
        <h4>3. 自訂內容</h4>
        文字：<input type="text" id="txt" value="16mil 1/E" oninput="generate()">
        內部：<input type="text" id="num" value="1" style="width:40px" oninput="generate()">
        大小：<input type="number" id="size" value="40" style="width:50px" oninput="generate()"> px
    </div>

    <button onclick="window.print()" style="margin-top:10px; padding:10px 20px; background:#28a745; color:white; border:none; border-radius:5px; cursor:pointer;">執行列印</button>
</div>

<div id="printArea"></div>

<script>
    var currentCorners = [0,0,1,0];

    function apply(t, n, c) {
        document.getElementById('txt').value = t;
        document.getElementById('num').value = n;
        currentCorners = c;
        generate();
    }

    function generate() {
        var area = document.getElementById('printArea');
        area.innerHTML = '';
        
        var pSize = document.getElementById('paperSize').value;
        var x = document.getElementById('posX').value;
        var y = document.getElementById('posY').value;
        var total = parseInt(document.getElementById('totalPage').value);
        var interval = parseInt(document.getElementById('interval').value);
        var iconSize = document.getElementById('size').value;
        var textStr = document.getElementById('txt').value;
        var numStr = document.getElementById('num').value;

        for (var i = 1; i <= total; i++) {
            var page = document.createElement('div');
            page.className = 'page ' + pSize;

            if ((i - 1) % interval === 0) {
                var item = document.createElement('div');
                item.className = 'print-item';
                item.style.left = x + 'mm';
                item.style.top = y + 'mm';

                // 生成圖示
                var icon = '<div class="icon-box" style="width:'+iconSize+'px;height:'+iconSize+'px;font-size:'+(iconSize*0.6)+'px;">' + numStr;
                if(currentCorners[0]) icon += '<div class="mask m-tl"></div>';
                if(currentCorners[1]) icon += '<div class="mask m-tr"></div>';
                if(currentCorners[2]) icon += '<div class="mask m-bl"></div>';
                if(currentCorners[3]) icon += '<div class="mask m-br"></div>';
                icon += '</div>';

                item.innerHTML = icon + '<span style="font-size:'+(iconSize*0.5)+'px; font-weight:bold;">' + textStr + '</span>';
                page.appendChild(item);
            }
            area.appendChild(page);
        }
    }

    // 初始預覽
    generate();
</script>

</body>
</html>
